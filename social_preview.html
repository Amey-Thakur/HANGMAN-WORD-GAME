<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hangman Word Game - Social Preview</title>
<!-- Renders the 1280x640 social preview from this repository's own assets. -->
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden}
.card{position:relative;width:1280px;height:640px;overflow:hidden;background:#d4d0cc;
      font-family:"Segoe UI",Tahoma,sans-serif}
.tb{height:52px;background:#3c3f41;display:flex;align-items:center;gap:13px;padding:0 20px;color:#e9e9e9;font-size:20px}
.cup{width:26px;height:26px;border-radius:4px;background:#e8e8e8;color:#3c3f41;font-size:15px;font-weight:800;
     display:flex;align-items:center;justify-content:center}
.ctl{margin-left:auto;display:flex;gap:30px;font-size:19px;color:#cfcfcf}
.mb{height:34px;background:#f0f0f0;border-bottom:1px solid #c8c8c8;display:flex;align-items:center;
    padding:0 14px;font-size:15px;color:#1a1a1a}
.canvas{position:relative;height:520px}
.guessed{position:absolute;left:52px;top:18px;font-size:38px;font-weight:700;color:#111;letter-spacing:.30em}
.btn{position:absolute;left:52px;top:82px;padding:9px 19px;background:#f0f0f0;border:1px solid #8b8b8b;
     font-size:17px;color:#111}
.word{position:absolute;left:52px;top:136px;font-size:32px;color:#111;letter-spacing:.40em}
.gal{position:absolute;left:96px;top:204px;width:327px;height:300px}
.miss{position:absolute;left:146px;top:212px;font-size:20px;font-weight:700;color:#111}
.info{position:absolute;left:604px;top:112px;width:600px}
.k{font-size:14px;font-weight:700;letter-spacing:.20em;color:#4a4a4a}
.h1{margin-top:14px;font-size:64px;font-weight:800;color:#111;line-height:1.02;letter-spacing:-.025em}
.rule{margin:26px 0 22px;width:88px;height:3px;background:#111}
.meta{font-size:19px;color:#2b2b2b;line-height:1.9}
.meta b{font-weight:700}
.by{margin-top:26px;font-size:20px;font-weight:700;color:#111}
.by span{display:block;font-size:13px;font-weight:600;letter-spacing:.18em;color:#5a5a5a;margin-bottom:7px}
.sb{position:absolute;left:0;right:0;bottom:0;height:34px;background:#fff;border-top:1px solid #c8c8c8;
    display:flex;align-items:center;padding:0 14px;font-size:14px;color:#111}
</style>
<div class="card">
  <div class="tb"><span class="cup">J</span>Applet Viewer: Mega.class<span class="ctl">&#8722; &#9633; &#10005;</span></div>
  <div class="mb">Applet</div>
  <div class="canvas">
    <div class="guessed">a n g m</div>
    <div class="btn">new word</div>
    <div class="word">&#95; a n g m a n</div>
    <svg class="gal" viewBox="0 0 360 330" fill="none" stroke="#111" stroke-width="2.4">
  <path d="M46 4 V300"/><path d="M46 4 H300"/><path d="M0 300 H340"/>
  <path d="M300 4 V46"/>
  <circle cx="300" cy="76" r="30" fill="#F5C08A"/>
  <path d="M300 106 V214"/>
  <path d="M300 124 L360 156"/>
  <path d="M300 214 L258 282"/><path d="M300 214 L342 282"/>
</svg>
    <div class="miss">Misses: 5</div>
    <div class="info">
      <div class="k">MINI PROJECT &middot; SEMESTER III &middot; CSL304</div>
      <div class="h1">Hangman<br>Word Game</div>
      <div class="rule"></div>
      <div class="meta"><b>Java Applet</b> &middot; AWT Graphics &middot; 2019</div>
      <div class="by"><span>DESIGNED &amp; DEVELOPED BY</span>Amey Thakur &middot; Mega Satish</div>
    </div>
  </div>
  <div class="sb">Applet started.</div>
</div>
</body>
</html>
