<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Word Game | Amey & Mega</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 1000px;
            height: 625px;
            background: #161b22;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
            overflow: hidden;
            position: relative;
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #8b949e;
            text-align: center;
            z-index: 10;
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            color: #58a6ff;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #8b949e;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8b949e;
        }

        #cheerpj-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Hangman Word Game</h1>
        <p>Presented as part of the 3rd Semester Mini-Project @ Terna Engineering College</p>
    </div>

    <div id="status">Connecting to CheerpJ Runtime...</div>
    <div id="app-container">
        <div id="cheerpj-container"></div>
    </div>

    <div class="footer">
        Powered by CheerpJ v3 & WebAssembly | &copy; 2020 Amey & Mega
    </div>

    <script>
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function initGame() {
            const status = document.getElementById('status');

            try {
                // Manually load CheerpJ loader to have better control
                await loadScript("https://cjrtnc.leaningtech.com/3.0/loader.js");

                status.innerText = "Initializing CheerpJ Engine...";

                // Initialize CheerpJ runtime
                await cheerpjInit({
                    enablePreciseMath: true,
                    javaProperties: ["java.version=1.8.0"]
                });

                status.innerText = "Launching Applet Archive...";

                await cheerpjRunApplet({
                    code: "Mega.class",
                    archive: "Mega.jar",
                    width: 1000,
                    height: 625,
                    container: document.getElementById("cheerpj-container")
                });

                status.style.display = 'none';
            } catch (e) {
                status.innerText = "Error: Failed to initialize CheerpJ.\n" + e.message;
                status.style.color = "#ff7b72";
                console.error("CheerpJ Initialization Error:", e);
            }
        }

        initGame();
    </script>
</body>

</html>
