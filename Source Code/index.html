<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Word Game | Amey & Mega</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 1000px;
            height: 625px;
            background: #161b22;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
            overflow: hidden;
            position: relative;
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            color: #58a6ff;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #8b949e;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8b949e;
        }

        /* CheerpJ specific styles to ensure it fits the container */
        #cheerpj-container {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- CheerpJ v3 Loader -->
    <script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>
</head>
<body>

    <div class="header">
        <h1>Hangman Word Game</h1>
        <p>Curated Computer Engineering Project | Amey Thakur & Mega Satish</p>
    </div>

    <div id="app-container">
        <div id="cheerpj-container"></div>
    </div>

    <div class="footer">
        Powered by CheerpJ v3 & WebAssembly | &copy; 2020 Amey & Mega
    </div>

    <script>
        async function initGame() {
            // Initialize CheerpJ runtime
            await cheerpjInit();
            
            // Run the applet
            // code: the class name
            // archive: the jar file
            // container: the DOM element to host the display
            cheerpjRunApplet({
                code: "Mega.class",
                archive: "Mega.jar",
                width: 1000,
                height: 625,
                container: document.getElementById("cheerpj-container")
            });
        }
        
        // Start the engine
        initGame();
    </script>
</body>
</html>
